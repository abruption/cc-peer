[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cc-peer"
dynamic = ["version"]
description = "Message Claude Code sessions on another machine over SSH"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "YEONGUK LEE", email = "hashcode@kakao.com" },
]
keywords = ["claude-code", "ssh", "cli", "cross-session", "messaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/abruption/cc-peer"
Repository = "https://github.com/abruption/cc-peer"
Issues = "https://github.com/abruption/cc-peer/issues"

[project.scripts]
cc-peer = "cc_peer:main"

[tool.hatch.version]
path = "cc_peer.py"
pattern = '__version__ = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.sdist]
include = ["cc_peer.py", "LICENSE", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["cc_peer.py"]
