name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the README promises; macOS is half the fleet.
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
        include:
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q cc_peer.py session_peer.py test_cc_peer.py test_session_peer.py
      - name: Unit tests
        run: python -m unittest discover -v

  package:
    name: wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install build
      - run: python -m build
      - name: Verify distribution contents
        run: |
          python -c 'import glob,zipfile; z=zipfile.ZipFile(glob.glob("dist/*.whl")[0]); assert "session_peer.py" in z.namelist(); assert "cc_peer.py" not in z.namelist()'
      - name: Install wheel and sdist independently
        run: |
          python -m venv /tmp/session-peer-wheel
          /tmp/session-peer-wheel/bin/pip install dist/*.whl
          /tmp/session-peer-wheel/bin/session-peer --version
          /tmp/session-peer-wheel/bin/session-peer update --json
          python -m venv /tmp/session-peer-sdist
          /tmp/session-peer-sdist/bin/pip install dist/*.tar.gz
          /tmp/session-peer-sdist/bin/session-peer --version

  shell:
    name: shellcheck install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        # SC2016 (no expansion in single quotes) is the point: the heredoc we
        # pipe to ssh must reach the remote shell with $HOME intact.
        # SC1007 misreads `CDPATH= cd -- ...`, which is the standard guard
        # against cd printing a path, not an empty assignment.
        run: shellcheck --shell=sh --exclude=SC2016,SC1007 install.sh

  install-smoke:
    name: install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Fresh install
        run: ./install.sh
      - name: Verify installation
        run: |
          test -f "$HOME/.local/share/session-peer/session_peer.py"
          test -L "$HOME/.local/bin/session-peer"
          "$HOME/.local/bin/session-peer" --version
      - name: Re-run upgrades existing install
        run: |
          sed -i 's/__version__ = .*/__version__ = "0.0.1"/' "$HOME/.local/share/session-peer/session_peer.py"
          ./install.sh
          version=$("$HOME/.local/bin/session-peer" --version)
          echo "$version"
          echo "$version" | grep -qv "0.0.1"
      - name: Uninstall
        run: |
          ./install.sh --uninstall
          test ! -d "$HOME/.claude/skills/session-peer"
          test ! -L "$HOME/.local/bin/session-peer"
